<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>

<body>

	<header>
		<!-- Fixed navbar -->
		<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
			<div class="collapse navbar-collapse container" id="navbarCollapse">
				<a class="navbar-brand d-flex align-items-center gap-3" href="#">
					<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"
						fill="currentColor" class="bi bi-person-workspace text-white"
						viewBox="0 0 16 16">
            <path
							d="M4 16s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-5.95a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5" />
            <path
							d="M2 1a2 2 0 0 0-2 2v9.5A1.5 1.5 0 0 0 1.5 14h.653a5.4 5.4 0 0 1 1.066-2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v9h-2.219c.554.654.89 1.373 1.066 2h.653a1.5 1.5 0 0 0 1.5-1.5V3a2 2 0 0 0-2-2z" />
          </svg> <span class="fw-bold text-white display-5 mb-0">EMS</span>
				</a>

				<ul class="navbar-nav mr-auto">
					<li class="nav-item active"><a class="nav-link" href="#">Home</a>
					</li>
					<li class="nav-item active"><a class="nav-link" href="#">Employees</a>
					</li>
					<li class="nav-item active"><a class="nav-link" href="#">Departments</a>
					</li>
					<li class="nav-item active"><a class="nav-link" href="#">Report</a>
					</li>
					<li class="nav-item active"><a class="nav-link" href="#">Logout</a>
					</li>
				</ul>
			</div>
		</nav>
	</header>

	<!-- Main jumbotron for a primary marketing message or call to action -->
	<div class="p-3 mb-4 mt-5 rounded-3">
		<div class="container py-5">
			<form class="d-flex justify-content-end" role="search" >
				<input class="form-control me-2" type="search" placeholder="Search"
					aria-label="Search" id="searchInput">
			</form>
		</div>


		<div class="vh-100 pt-2">
			<!-- or bg-body-secondary or custom -->
			<div class="container">
				<table class="table table-bordered">
					<thead>
						<tr>
							<th scope="col">ID</th>
							<th scope="col">First Name</th>
							<th scope="col">Last Name</th>
							<th scope="col">Email</th>
							<th scope="col">Job Title</th>
							<th scope="col">Salary</th>
							<th scope="col">Actions</th>
						</tr>
					</thead>
					<tbody id="employeeTableBody">
						<tr th:each="emp : ${empList}">
							<th scope="row" th:text="${emp.id}">1</th>
							<td th:text="${emp.first_name}">First</td>
							<td th:text="${emp.last_name}">Last</td>
							<td th:text="${emp.email}">Email</td>
							<td th:text="${emp.job_title}">Job</td>
							<td th:text="${emp.salary}">0.00</td>
							<td>
								<button type="button" class="btn btn-outline-primary btn-sm">
									<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
										fill="currentColor" class="bi bi-pencil-square"
										viewBox="0 0 16 16">
                   						 <path
											d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z">
                   						 </path>
                   						 <path fill-rule="evenodd"
											d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z">
                    					</path>
                  					</svg>
								</button>
								<button type="button" class="btn btn-outline-danger btn-sm">
									<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
										fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                    						<path
											d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5">
      										 </path>		
              					    </svg>
								</button>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="container py-2 d-flex justify-content-end">
					<button type="button" class="btn btn-success"
						data-bs-toggle="modal" data-bs-target="#addEmpModal">Add
						Employee</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Add Employee Modal -->
	<div class="modal fade" id="addEmpModal" data-bs-backdrop="static"
		data-bs-keyboard="false" tabindex="-1"
		aria-labelledby="staticBackdropLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="staticBackdropLabel">Add Employee</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="add-emp-form">
						<div class="form-group row align-items-center">
							<label for="First Name" class="col-sm-2 col-form-label">First
								Name</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="first-name"
									placeholder="First Name">
							</div>

							<label for="Last Name" class="col-sm-2 col-form-label">Last
								Name</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="last-name"
									placeholder="Last Name">
							</div>

							<label for="Email" class="col-sm-2 col-form-label">Email</label>
							<div class="col-sm-10">
								<input type="email" class="form-control" id="email"
									placeholder="Email">
							</div>

							<label for="Job Title" class="col-sm-2 col-form-label">Job
								Title</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="job-title"
									placeholder="Job Title">
							</div>

							<label for="Salary" class="col-sm-2 col-form-label">Salary</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="salary"
									placeholder="Salary">
							</div>
						</div>
					</form>
				</div>

				<!-- Modal Footer -->
				<div class="modal-footer">
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}" id="_csrf" />
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-primary" id="add-emp-btn">Add</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit Employee Modal -->
	<div class="modal fade" id="editEmpModal" data-bs-backdrop="static"
		data-bs-keyboard="false" tabindex="-1"
		aria-labelledby="staticBackdropLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="staticBackdropLabel">Edit Employee</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="edit-emp-form">
						<input type="hidden" name="id" id="empId">
						<div class="form-group row align-items-center">
							<label for="First Name" class="col-sm-2 col-form-label">First
								Name</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="first-name"
									placeholder="First Name">
							</div>

							<label for="Last Name" class="col-sm-2 col-form-label">Last
								Name</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="last-name"
									placeholder="Last Name">
							</div>

							<label for="Email" class="col-sm-2 col-form-label">Email</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="email"
									placeholder="Email">
							</div>

							<label for="Job Title" class="col-sm-2 col-form-label">Job
								Title</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="job-title"
									placeholder="Job Title">
							</div>

							<label for="Salary" class="col-sm-2 col-form-label">Salary</label>
							<div class="col-sm-10">
								<input type="text" class="form-control" id="salary"
									placeholder="Salary">
							</div>
						</div>
					</form>
				</div>

				<!-- Modal Footer -->
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-primary" id="add-emp-btn">Add</button>
				</div>
			</div>
		</div>
	</div>
	<!-- <footer class="container">
    <p>© Company 2017-2018</p>
  </footer> -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

		<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

	<script src="js.js"></script>

</body>

</html>
